<!doctype html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>አሃዱ — Ahadu 2.0</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Before first paint, so arriving from a dark page is not a white flash.
      try {
        var t = localStorage.getItem('ahadu.theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Says that scripting is on. The narrow navigation is a drawer only
      // under this class; see tools/shared/menu.ts.
      document.documentElement.className += ' js';
    </script>
  </head>
  <body>
    <!--
      Text with a data-i18n attribute is filled from tools/playground/strings.ts
      on load and whenever the language changes, so neither language is the one
      hard-coded in the markup.
    -->
    <!--
      The site's own header, shared with every other page (shared/chrome.css).
      The playground is a page of the site, not somewhere else: without this
      there was no way back, and its theme and language were its own.
      Hrefs are set from the current language by main.ts.
    -->
    <header class="sitebar">
      <a class="brand" id="brand" href="/am/">
        <strong>አሃዱ</strong>
        <span class="version">2.0</span>
      </a>

      <!-- Below 760px this is a drawer, opened by #menu (shared/menu.ts). -->
      <nav class="nav" id="sitenav" data-i18n-label="navLabel">
        <a data-section="home" data-i18n="navHome"></a>
        <a data-section="learn" data-i18n="navLearn"></a>
        <a data-section="reference" data-i18n="navReference"></a>
        <a data-section="examples" data-i18n="navExamples"></a>
        <a href="/playground/" aria-current="page" data-i18n="navPlayground"></a>
      </nav>

      <div class="spacer"></div>

      <button id="language" class="chip" type="button" data-i18n="languageToggle"></button>
      <button id="theme" class="chip" type="button" aria-live="off">◐</button>
      <button
        id="menu"
        class="chip menu"
        type="button"
        aria-controls="sitenav"
        aria-expanded="false"
        data-i18n-label="navMenu"
        hidden
      >
        <span aria-hidden="true">☰</span>
      </button>

      <!-- Closes the drawer when the page behind it is tapped. -->
      <div class="scrim" id="nav-scrim" hidden></div>
    </header>

    <!--
      The page's heading. Not drawn — the header already says where you are
      to anyone who can see it — but a page with no h1 gives a screen reader
      nothing to announce and nothing to jump to, and this is the one page of
      the site whose heading is not in its own prose.
    -->
    <h1 class="sr-only" data-i18n="pageTitle"></h1>

    <!-- The playground's own toolbar: the things only it has. -->
    <header class="bar">
      <!-- The first option names the control, so no separate label is needed. -->
      <label class="examples">
        <select id="examples" data-i18n-label="examples"></select>
      </label>

      <div class="spacer"></div>

      <output id="status" class="status" aria-live="polite"></output>

      <button id="run" class="run" type="button" data-i18n="run"></button>
      <button id="stop" class="stop" type="button" data-i18n="stop" hidden></button>
    </header>

    <main class="layout">
      <section class="top">
        <div class="editor-wrap">
          <!--
            The gutter, the coloured backdrop and the transparent textarea share
            one set of metrics; see styles.css for why the editor does not wrap.
          -->
          <pre id="gutter" class="gutter" aria-hidden="true"></pre>
          <pre id="backdrop" class="backdrop" aria-hidden="true"></pre>
          <textarea
            id="editor"
            class="editor"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            data-i18n-label="editorLabel"
          ></textarea>
        </div>

        <div id="editor-status" class="editor-status"></div>
      </section>

      <section class="bottom">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-panel="output" data-i18n="tabOutput" aria-selected="true"></button>
          <button class="tab" role="tab" data-panel="tokens" data-i18n="tabTokens" aria-selected="false"></button>
          <button class="tab" role="tab" data-panel="ast" data-i18n="tabAst" aria-selected="false"></button>
          <button class="tab" role="tab" data-panel="errors" aria-selected="false">
            <span data-i18n="tabErrors"></span>
            <span id="error-count" class="count"></span>
          </button>
        </div>

        <div class="panels">
          <pre id="panel-output" class="panel" role="tabpanel"></pre>
          <div id="panel-tokens" class="panel" role="tabpanel" hidden></div>
          <div id="panel-ast" class="panel" role="tabpanel" hidden></div>
          <div id="panel-errors" class="panel" role="tabpanel" hidden></div>
        </div>
      </section>
    </main>

    <!-- Explains the error the pointer is over; positioned from script. -->
    <div id="tip" class="tip" role="status" hidden></div>

    <!--
      Asked before a run, not during one: አንብብ is synchronous and the program
      runs in a worker, so it cannot stop half way and wait. See view.ts.
    -->
    <div id="ask" class="ask" hidden>
      <div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="ask-title">
        <h2 id="ask-title" data-i18n="inputLabel"></h2>
        <p class="ask-why"><span data-i18n="inputWhy"></span> <span data-i18n="inputHint"></span></p>
        <textarea id="ask-input" spellcheck="false" data-i18n-label="inputLabel"></textarea>
        <div class="ask-actions">
          <button id="ask-cancel" type="button" data-i18n="cancel"></button>
          <button id="ask-run" class="run" type="button" data-i18n="run"></button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
