# Deploys the site to Cloudflare Pages.
#
# Only needed if you would rather not give Cloudflare read access to this
# repository. If you connect the repo in the Cloudflare dashboard instead, it
# builds and deploys on every push with no workflow and no secrets at all —
# see DEPLOY.md, which recommends that route.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build runs every code sample on the site through the interpreter
      # and fails on one whose output is not what its page claims, so a broken
      # lesson cannot reach the web (SITE.md §2).
      - run: npm run site:build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tools/site/dist --project-name=ahadu --branch=main
