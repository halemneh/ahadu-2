# Deploys the site to Cloudflare Pages.
#
# **Not the live route.** GitHub Pages is (see pages.yml and DEPLOY.md); this
# is kept as the alternative, because Cloudflare Pages serves a private
# repository on its free plan and GitHub Pages does not.
#
# Manual only, so the two cannot race each other to the same domain. Needs two
# repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

name: Deploy (Cloudflare — manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build runs every code sample on the site through the interpreter
      # and fails on one whose output is not what its page claims, so a broken
      # lesson cannot reach the web (SITE.md §2).
      - run: npm run site:build

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tools/site/dist --project-name=ahadu --branch=main
