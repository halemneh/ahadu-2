# Builds the site and publishes it to GitHub Pages.
#
# Nothing is committed: the built site is uploaded as an artifact and served
# from there, so `tools/site/dist/` stays out of the repository.
#
# **Manual until Pages is turned on.** GitHub Pages serves a private
# repository only on a paid plan, and this repository is private on the free
# one, so `configure-pages` cannot find a Pages site and the job fails. A
# workflow that fails on every push teaches everyone to ignore a red tick, so
# it waits to be asked.
#
# To make it live: Settings → Pages → Source: **GitHub Actions** (possible
# once the repository is public, or on Pro), then put the push trigger back —
# uncomment the two lines below. DEPLOY.md has the whole picture.

name: Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # This runs every code sample on the site through the interpreter and
      # fails on one whose output is not what its page claims (SITE.md §2),
      # so a lesson that lies cannot reach the web.
      - run: npm run site:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
